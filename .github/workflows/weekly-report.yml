name: mETH Protocol Weekly Report

on:
  # 1. 允许在 GitHub Actions 页面手动触发执行
  workflow_dispatch:

  # 2. 定时任务触发
  schedule:
    - cron: '0 0 * * 1,4'

jobs:
  generate-and-send-report:
    runs-on: ubuntu-latest # 指定运行的系统环境
    permissions:
      actions: read    # 允许脚本读取 Actions 的运行记录和日志
      contents: read   # 允许检出代码
      # 👆 必须加上这段权限声明 👆
    # 👇👇👇 必须加上这三行，告诉系统去 meth-monitor 文件夹里执行命令 👇👇👇
    defaults:
      run:
        working-directory: ./meth-monitor

    steps:
      # 第 1 步：检出代码仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 第 2 步：配置 Node.js 运行环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 第 3 步：安装 package.json 中定义的依赖
      - name: Install dependencies
        run: npm install

      # 第 4 步：执行生成和发送周报的统帅脚本
      - name: Run master script and send report
        run: node weekly-report.js
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RPC_URL: ${{ secrets.RPC_URL }}
          L2_RPC_URL: ${{ secrets.L2_RPC_URL }}
          FRONTEND_CONFIG_URL: ${{ secrets.FRONTEND_CONFIG_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}