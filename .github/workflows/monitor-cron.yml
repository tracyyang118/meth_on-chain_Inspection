name: mETH On-Chain Inspection

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-inspections:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./meth-monitor

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: ⚙️ 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 安装依赖库
        run: npm install

      # 注意：下面每一个 node 执行步骤都加了 if: always()
      - name: 🚀 执行跨链对账巡检 (Bridge Peg)
        if: always()
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          L2_RPC_URL: ${{ secrets.L2_RPC_URL }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: node bridge-peg-monitor.js

      - name: 🚀 执行预言机存活巡检 (Oracle Liveness)
        if: always()
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: node oracle-liveness.js

      - name: 🚀 执行流动性挤兑巡检 (Liquidity Monitor)
        if: always()
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: node liquidity-monitor.js

      - name: 🚀 执行前端防投毒巡检 (Frontend Integrity)
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: node frontend-monitor.js

      - name: 🚀 执行兑换率防跌断言 (Exchange Rate Monitor)
        if: always()
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: node rate-monitor.js